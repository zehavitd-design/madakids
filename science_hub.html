<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>מעבדת המדע האינטראקטיבית</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.85);
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
      --accent-green: #22c55e;
      --accent-orange: #f97316;
      --accent-pink: #ec4899;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a 60%, #020617);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
      overflow-x: hidden;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
    }

    /* Header */
    header {
      text-align: center;
      padding: 28px 20px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.12), rgba(168, 85, 247, 0.12));
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(12px);
      position: relative;
    }

    header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #38bdf8, #c084fc, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.15rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .announcement {
      background: rgba(249, 115, 22, 0.15);
      border: 1px solid rgba(249, 115, 22, 0.4);
      color: #fdba74;
      padding: 10px 18px;
      border-radius: 14px;
      font-size: 0.95rem;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .wix-btn {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      color: white;
      text-decoration: none;
      padding: 11px 22px;
      border-radius: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, box-shadow 0.2s;
      border: none;
      cursor: pointer;
    }

    .wix-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
    }

    /* Category Filter Tabs */
    .tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 14px;
      margin-bottom: 28px;
    }

    .tab-btn {
      background: var(--bg-card);
      border: 2px solid rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      padding: 16px;
      border-radius: 18px;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
    }

    .tab-btn:hover {
      border-color: rgba(56, 189, 248, 0.5);
      transform: translateY(-3px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(168, 85, 247, 0.25));
      border-color: var(--accent-blue);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.2);
    }

    .tab-icon {
      font-size: 1.5rem;
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 20px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(56, 189, 248, 0.5);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .card-icon {
      font-size: 2.6rem;
      background: rgba(255, 255, 255, 0.06);
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
    }

    .badge {
      font-size: 0.78rem;
      padding: 5px 11px;
      border-radius: 20px;
      font-weight: 600;
    }

    .cat-quizzes .badge { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; }
    .cat-games .badge { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    .cat-experiments .badge { background: rgba(249, 115, 22, 0.2); color: #fdba74; }
    .cat-articles .badge { background: rgba(56, 189, 248, 0.2); color: #7dd3fc; }

    .card h3 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .card p {
      color: var(--text-muted);
      font-size: 0.96rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .card-btn {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .card:hover .card-btn {
      background: var(--accent-blue);
      color: #0f172a;
    }

    /* Modal for interactive activities */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 28px;
      position: relative;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
    }

    .close-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .close-btn:hover {
      background: #ef4444;
    }

    .modal h2 {
      font-size: 1.8rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .exp-box {
      background: rgba(15, 23, 42, 0.6);
      padding: 16px;
      border-radius: 14px;
      margin-bottom: 16px;
    }

    .exp-box h4 {
      color: var(--accent-blue);
      margin-bottom: 8px;
    }

    .exp-box ul, .exp-box ol {
      padding-right: 22px;
      line-height: 1.7;
    }

    /* Built-in Quiz styles */
    .quiz-option {
      display: block;
      width: 100%;
      text-align: right;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: white;
      padding: 13px 16px;
      margin-bottom: 10px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
    }

    .quiz-option:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--accent-blue);
    }

    .quiz-option.correct {
      background: rgba(34, 197, 94, 0.3);
      border-color: #22c55e;
    }

    .quiz-option.wrong {
      background: rgba(239, 68, 68, 0.3);
      border-color: #ef4444;
    }

    /* Built-in Memory Game styles */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .mem-card {
      aspect-ratio: 1;
      background: linear-gradient(135deg, #334155, #1e293b);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s, background 0.2s;
    }

    .mem-card.revealed {
      background: rgba(56, 189, 248, 0.25);
      border-color: var(--accent-blue);
    }

    .mem-card.matched {
      background: rgba(34, 197, 94, 0.25);
      border-color: #22c55e;
      cursor: default;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div class="announcement" id="announcementBar">
        <span>📣</span>
        <span id="announcementText">ברוכים הבאים למעבדת המדע!</span>
      </div>
      <a href="https://www.wix.com" target="_blank" id="wixMainBtn" class="wix-btn">
        🌐 לאתר המדע הראשי (Wix)
      </a>
    </div>

    <header>
      <h1 id="siteTitle">🔬 מעבדת המדע האינטראקטיבית</h1>
      <p id="siteSubtitle">בחרו פעילות כדי להתחיל לחקור, לשחק ולגלות!</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" onclick="filterCategory('all', this)">
        <span class="tab-icon">✨</span> הכל
      </button>
      <button class="tab-btn" onclick="filterCategory('quizzes', this)">
        <span class="tab-icon">❓</span> חידונים
      </button>
      <button class="tab-btn" onclick="filterCategory('games', this)">
        <span class="tab-icon">🎮</span> משחקים
      </button>
      <button class="tab-btn" onclick="filterCategory('experiments', this)">
        <span class="tab-icon">🧪</span> ניסויים לבית
      </button>
      <button class="tab-btn" onclick="filterCategory('articles', this)">
        <span class="tab-icon">📚</span> מאמרי מדע
      </button>
    </div>

    <div class="grid" id="cardsGrid"></div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script>
    // נתוני ברירת מחדל (למקרה שפותחים את הקובץ ישירות ללא שרת או שהאינטרנט מנותק)
    const DEFAULT_DATA = {
      siteTitle: "🔬 מעבדת המדע האינטראקטיבית",
      siteSubtitle: "בחרו פעילות כדי להתחיל לחקור, לשחק ולגלות!",
      wixMainUrl: "https://www.wix.com",
      announcement: "ברוכים הבאים לשיעור מדעים! השבוע נוסף ניסוי חדש בנושא הר געש ביתי 🌋",
      items: [
        {
          id: "q1",
          category: "quizzes",
          title: "חידון מערכת השמש",
          description: "כמה כוכבי לכת אתם באמת מכירים? בחנו את עצמכם בחידון אינטראקטיבי מהיר!",
          icon: "🪐",
          badge: "חידון מובנה",
          type: "builtin-quiz"
        },
        {
          id: "q2",
          category: "quizzes",
          title: "טריוויה: גוף האדם",
          description: "שאלות מאתגרות על הלב, המוח ומערכת הנשימה (נפתח באתר).",
          icon: "🧬",
          badge: "10 שאלות",
          type: "link",
          url: "https://www.wix.com"
        },
        {
          id: "g1",
          category: "games",
          title: "זיכרון מדעי: יסודות וכלים",
          description: "משחק הזיכרון של המעבדה – מצאו את הזוגות התואמים במספר המהלכים הקצר ביותר!",
          icon: "🎮",
          badge: "משחק מובנה",
          type: "builtin-game"
        },
        {
          id: "g2",
          category: "games",
          title: "סימולטור מעגלים חשמליים (PhET)",
          description: "הרכיבו מעגל חשמלי, הדליקו נורות ובדקו אילו חומרים מוליכים חשמל.",
          icon: "⚡",
          badge: "סימולציה חיה",
          type: "link",
          url: "https://phet.colorado.edu/sims/html/circuit-construction-kit-dc/latest/circuit-construction-kit-dc_he.html"
        },
        {
          id: "e1",
          category: "experiments",
          title: "הר געש מקציף במטבח",
          description: "איך יוצרים התפרצות געשית בטוחה בעזרת סודה לשתייה, חומץ וצבע מאכל?",
          icon: "🌋",
          badge: "ניסוי ביתי",
          type: "modal",
          content: {
            time: "10 דקות",
            difficulty: "קל מאוד",
            materials: ["כוס או בקבוק קטן", "2 כפות סודה לשתייה", "חצי כוס חומץ", "מעט סבון כלים", "צבע מאכל אדום (לא חובה)", "מגש (כדי לא ללכלך)"],
            steps: [
              "מניחים את הכוס במרכז המגש.",
              "מכניסים לתוך הכוס את הסודה לשתייה, כמה טיפות סבון כלים וצבע מאכל.",
              "שופכים פנימה את החומץ בבת אחת ומתרחקים מעט!",
              "צופים בקצף האדום מתפרץ החוצה כמו לבה אמיתית."
            ],
            science: "התגובה הכימית בין החומץ (חומצה) לסודה לשתייה (בסיס) משחררת גז שנקרא פחמן דו-חמצני (CO2). הגז נלכד בתוך סבון הכלים ויוצר אלפי בועות קצף שמתפרצות החוצה!"
          }
        },
        {
          id: "e2",
          category: "experiments",
          title: "כתב סתרים ממיץ לימון",
          description: "כתבו הודעה סודית שנחשפת רק כשמחממים את הדף!",
          icon: "🍋",
          badge: "ניסוי ביתי",
          type: "modal",
          content: {
            time: "15 דקות",
            difficulty: "קל (נדרשת השגחת מבוגר בחימום)",
            materials: ["חצי לימון סחוט", "מקלון אוזניים או מכחול דק", "דף נייר לבן", "מנורת שולחן חמה או מגהץ (בעזרת מבוגר)"],
            steps: [
              "טובלים את מקלון האוזניים במיץ הלימון.",
              "כותבים או מציירים הודעה סודית על הדף הלבן.",
              "ממתינים כ-5 דקות עד שהדף מתייבש לחלוטין והכתב נעלם.",
              "מקרבים את הדף למקור חום (בעזרת מבוגר!) ורואים איך הכתב משחים ומתגלה."
            ],
            science: "מיץ הלימון מכיל תרכובות פחמן שהן שקופות בטמפרטורת החדר. כאשר מחממים את הנייר, התרכובות האלו מתחמצנות ונשרפות מהר יותר מהנייר עצמו, ולכן הן הופכות לחומות!"
          }
        },
        {
          id: "a1",
          category: "articles",
          title: "איך נוצרים ברקים ורעמים?",
          description: "למה אנחנו רואים את הברק לפני שאנחנו שומעים את הרעם? מאמר קצר ומרתק באתר.",
          icon: "🌩️",
          badge: "מאמר באתר",
          type: "link",
          url: "https://www.wix.com"
        },
        {
          id: "a2",
          category: "articles",
          title: "האם יש חיים על מאדים?",
          description: "כל מה שרכבי החלל של נאס״א גילו על כוכב הלכת האדום בשנים האחרונות.",
          icon: "🚀",
          badge: "מאמר באתר",
          type: "link",
          url: "https://www.wix.com"
        }
      ]
    };

    let appData = DEFAULT_DATA;
    let currentCategory = 'all';

    // ניסיון לטעון קובץ activities.json חיצוני (לעדכון מרכזי!)
    async function loadActivities() {
      try {
        const res = await fetch('activities.json?t=' + Date.now());
        if (res.ok) {
          appData = await res.json();
        }
      } catch (e) {
        // עובד עם DEFAULT_DATA אם נפתח כקובץ מקומי ללא שרת
      }
      renderHeader();
      renderCards();
    }

    function renderHeader() {
      document.getElementById('siteTitle').textContent = appData.siteTitle;
      document.getElementById('siteSubtitle').textContent = appData.siteSubtitle;
      document.getElementById('announcementText').textContent = appData.announcement;
      document.getElementById('wixMainBtn').href = appData.wixMainUrl;
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderCards();
    }

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      const filtered = currentCategory === 'all'
        ? appData.items
        : appData.items.filter(item => item.category === currentCategory);

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = `card cat-${item.category}`;

        let btnLabel = 'פתיחה ⬅️';
        if (item.type === 'builtin-quiz') btnLabel = 'התחל חידון 🎯';
        if (item.type === 'builtin-game') btnLabel = 'שחק עכשיו 🎮';
        if (item.type === 'modal') btnLabel = 'הוראות הניסוי 🧪';
        if (item.type === 'link') btnLabel = 'מעבר לפעילות 🌐';

        card.innerHTML = `
          <div>
            <div class="card-header">
              <div class="card-icon">${item.icon}</div>
              <span class="badge">${item.badge}</span>
            </div>
            <h3>${item.title}</h3>
            <p>${item.description}</p>
          </div>
          <button class="card-btn" onclick="openActivity('${item.id}')">${btnLabel}</button>
        `;
        grid.appendChild(card);
      });
    }

    function openActivity(id) {
      const item = appData.items.find(x => x.id === id);
      if (!item) return;

      if (item.type === 'link') {
        window.open(item.url, '_blank');
      } else if (item.type === 'modal') {
        showExperimentModal(item);
      } else if (item.type === 'builtin-quiz') {
        showBuiltInQuiz();
      } else if (item.type === 'builtin-game') {
        showBuiltInMemoryGame();
      }
    }

    function showExperimentModal(item) {
      const c = item.content;
      const body = document.getElementById('modalBody');
      body.innerHTML = `
        <h2><span>${item.icon}</span> ${item.title}</h2>
        <p style="color: var(--text-muted); margin-bottom: 16px;">
          ⏱️ זמן משוער: <strong>${c.time}</strong> | 📊 רמת קושי: <strong>${c.difficulty}</strong>
        </p>
        <div class="exp-box">
          <h4>🛒 מה צריך?</h4>
          <ul>${c.materials.map(m => `<li>${m}</li>`).join('')}</ul>
        </div>
        <div class="exp-box">
          <h4>📋 שלבי הניסוי:</h4>
          <ol>${c.steps.map(s => `<li>${s}</li>`).join('')}</ol>
        </div>
        <div class="exp-box" style="border-right: 4px solid var(--accent-blue);">
          <h4>🧠 ההסבר המדעי:</h4>
          <p style="line-height: 1.6;">${c.science}</p>
        </div>
      `;
      document.getElementById('modalOverlay').classList.add('open');
    }

    // חידון מובנה לדוגמה
    const QUIZ_QUESTIONS = [
      {
        q: "איזה כוכב לכת הוא הגדול ביותר במערכת השמש שלנו?",
        options: ["מאדים", "צדק (יופיטר)", "שבתאי", "כדור הארץ"],
        answer: 1
      },
      {
        q: "איזה כוכב לכת מכונה 'כוכב הלכת האדום'?",
        options: ["נוגה", "חמה", "מאדים", "נפטון"],
        answer: 2
      },
      {
        q: "כמה זמן לוקח לכדור הארץ להשלים הקפה אחת סביב השמש?",
        options: ["24 שעות", "חודש אחד", "365 ימים (שנה)", "10 שנים"],
        answer: 2
      }
    ];
    let quizIndex = 0;
    let quizScore = 0;

    function showBuiltInQuiz() {
      quizIndex = 0;
      quizScore = 0;
      renderQuizStep();
      document.getElementById('modalOverlay').classList.add('open');
    }

    function renderQuizStep() {
      const body = document.getElementById('modalBody');
      if (quizIndex >= QUIZ_QUESTIONS.length) {
        body.innerHTML = `
          <h2>🏆 סיימתם את החידון!</h2>
          <div class="exp-box" style="text-align:center; padding: 28px;">
            <p style="font-size: 1.4rem; margin-bottom: 16px;">
              עניתם נכון על <strong>${quizScore}</strong> מתוך <strong>${QUIZ_QUESTIONS.length}</strong> שאלות!
            </p>
            <button class="wix-btn" onclick="showBuiltInQuiz()">🔄 נסו שוב</button>
          </div>
        `;
        return;
      }

      const curr = QUIZ_QUESTIONS[quizIndex];
      body.innerHTML = `
        <h2>🪐 חידון מערכת השמש (שאלה ${quizIndex + 1} מתוך ${QUIZ_QUESTIONS.length})</h2>
        <p style="font-size: 1.2rem; margin-bottom: 18px;">${curr.q}</p>
        <div id="quizOptions">
          ${curr.options.map((opt, idx) => `
            <button class="quiz-option" onclick="checkQuizAnswer(${idx}, this)">${opt}</button>
          `).join('')}
        </div>
      `;
    }

    function checkQuizAnswer(selected, btn) {
      const curr = QUIZ_QUESTIONS[quizIndex];
      const buttons = document.querySelectorAll('.quiz-option');
      buttons.forEach(b => b.disabled = true);

      if (selected === curr.answer) {
        btn.classList.add('correct');
        quizScore++;
      } else {
        btn.classList.add('wrong');
        buttons[curr.answer].classList.add('correct');
      }

      setTimeout(() => {
        quizIndex++;
        renderQuizStep();
      }, 1100);
    }

    // משחק זיכרון מובנה לדוגמה
    let memCards = [];
    let memFlipped = [];
    let memMoves = 0;

    function showBuiltInMemoryGame() {
      const icons = ['🔬', '🧲', '🧪', '🧬', '🪐', '⚡'];
      memCards = [...icons, ...icons]
        .sort(() => Math.random() - 0.5)
        .map((icon, idx) => ({ id: idx, icon, revealed: false, matched: false }));
      memFlipped = [];
      memMoves = 0;
      renderMemoryGame();
      document.getElementById('modalOverlay').classList.add('open');
    }

    function renderMemoryGame() {
      const body = document.getElementById('modalBody');
      const allMatched = memCards.every(c => c.matched);
      body.innerHTML = `
        <h2>🎮 זיכרון מדעי</h2>
        <p style="color: var(--text-muted);">מספר מהלכים: <strong>${memMoves}</strong> ${allMatched ? ' — 🎉 כל הכבוד! מצאתם את כל הזוגות!' : ''}</p>
        <div class="memory-grid">
          ${memCards.map((c, idx) => `
            <div class="mem-card ${c.revealed || c.matched ? 'revealed' : ''} ${c.matched ? 'matched' : ''}"
                 onclick="flipMemCard(${idx})">
              ${c.revealed || c.matched ? c.icon : '❓'}
            </div>
          `).join('')}
        </div>
        <div style="margin-top: 18px; text-align: left;">
          <button class="wix-btn" onclick="showBuiltInMemoryGame()">🔄 משחק חדש</button>
        </div>
      `;
    }

    function flipMemCard(idx) {
      const card = memCards[idx];
      if (card.revealed || card.matched || memFlipped.length === 2) return;

      card.revealed = true;
      memFlipped.push(card);
      renderMemoryGame();

      if (memFlipped.length === 2) {
        memMoves++;
        const [first, second] = memFlipped;
        if (first.icon === second.icon) {
          first.matched = true;
          second.matched = true;
          memFlipped = [];
          renderMemoryGame();
        } else {
          setTimeout(() => {
            first.revealed = false;
            second.revealed = false;
            memFlipped = [];
            renderMemoryGame();
          }, 800);
        }
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('open');
    }

    loadActivities();
  </script>
</body>
</html>
